<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1c2a4a">
<title>Villa Corsu</title>
<style>
  :root{
    --sky-1:#151d38;
    --sky-2:#3a4a78;
    --sky-3:#8c6a93;
    --sky-4:#e08a6b;
    --sky-5:#f4b860;
    --sky-6:#fbdd9a;
    --ink:#ffffff;
    --ink-dim:rgba(255,255,255,.72);
    --glass-bg:rgba(255,255,255,.14);
    --glass-brd:rgba(255,255,255,.32);
    --site-1:#2fa0c8; --site-2:#0d5c78;
    --guide-1:#c7623f; --guide-2:#7c2f1c;
    --gestion-1:#5b6472; --gestion-2:#2b3038;
    --depenses-1:#d9a53a; --depenses-2:#8f6a12;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

  html,body{
    height:100%;
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    overflow:hidden;
  }

  body{
    position:relative;
    height:100dvh;
    background:linear-gradient(180deg,
      var(--sky-1) 0%,
      var(--sky-2) 24%,
      var(--sky-3) 42%,
      var(--sky-4) 60%,
      var(--sky-5) 74%,
      var(--sky-6) 86%);
  }

  /* ---------- decor: stars ---------- */
  .stars{position:absolute; inset:0 0 55% 0; overflow:hidden;}
  .stars span{
    position:absolute; width:2px; height:2px; border-radius:50%;
    background:#fff; opacity:.55;
  }

  /* ---------- layout ---------- */
  .home{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 22px);
  }

  /* ---------- header / logo ---------- */
  .header{
    align-self:center;
    opacity:0;
    animation:riseIn .6s ease forwards;
  }
  .brand{
    width:324px; height:324px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .brand canvas{
    width:100%; height:100%;
    filter: drop-shadow(0 10px 24px rgba(0,0,0,.35));
  }

  /* ---------- widget ---------- */
  .widget{
    align-self:center;
    width:100%;
    max-width:340px;
    background:var(--glass-bg);
    border:1px solid var(--glass-brd);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
    backdrop-filter:blur(18px) saturate(150%);
    border-radius:26px;
    padding:18px 22px 16px;
    text-align:center;
    color:var(--ink);
    box-shadow:0 8px 30px rgba(0,0,0,.18);
    opacity:0;
    animation:riseIn .6s ease .08s forwards;
  }
  .widget .time{
    font-size:44px;
    font-weight:200;
    letter-spacing:1px;
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .widget .date{
    margin-top:6px;
    font-size:14px;
    font-weight:500;
    color:var(--ink-dim);
    text-transform:capitalize;
  }
  .widget .divider{
    width:36px; height:1px;
    background:var(--glass-brd);
    margin:12px auto;
  }
  .widget .place{
    font-size:12.5px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--ink-dim);
    font-weight:600;
  }
  .widget .place b{
    color:var(--ink);
    font-weight:700;
    letter-spacing:1.5px;
  }

  /* ---------- app grid ---------- */
  .app-grid{
    align-self:center;
    display:grid;
    grid-template-columns:repeat(2, 78px);
    gap:26px 30px;
    justify-content:center;
  }
  .app{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    text-decoration:none;
    -webkit-user-select:none;
    user-select:none;
    opacity:0;
    animation:riseIn .55s ease forwards;
  }
  .app:nth-child(1){animation-delay:.08s;}
  .app:nth-child(2){animation-delay:.16s;}
  .app:nth-child(3){animation-delay:.24s;}
  .app:nth-child(4){animation-delay:.32s;}

  .icon{
    width:64px; height:64px;
    border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:
      0 6px 14px rgba(0,0,0,.28),
      inset 0 1px 0 rgba(255,255,255,.35),
      inset 0 -6px 10px rgba(0,0,0,.12);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .icon svg{width:30px; height:30px;}
  .app:active .icon{
    transform:scale(.88);
    box-shadow:
      0 3px 8px rgba(0,0,0,.24),
      inset 0 1px 0 rgba(255,255,255,.3),
      inset 0 -4px 8px rgba(0,0,0,.14);
  }

  .icon-site     { background:linear-gradient(155deg, var(--site-1), var(--site-2)); }
  .icon-guide    { background:linear-gradient(155deg, var(--guide-1), var(--guide-2)); }
  .icon-gestion  { background:linear-gradient(155deg, var(--gestion-1), var(--gestion-2)); }
  .icon-depenses { background:linear-gradient(155deg, var(--depenses-1), var(--depenses-2)); }

  .label{
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    text-shadow:0 1px 4px rgba(0,0,0,.35);
  }

  .app:focus-visible .icon{
    outline:2px solid #fff;
    outline-offset:3px;
  }

  /* ---------- page dots (decorative) ---------- */
  .dots{
    align-self:center;
    display:flex; gap:6px;
    opacity:0;
    animation:riseIn .5s ease .4s forwards;
  }
  .dots span{
    width:6px; height:6px; border-radius:50%;
    background:rgba(255,255,255,.35);
  }
  .dots span.active{ background:#fff; }

  @keyframes riseIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  @media (prefers-reduced-motion: reduce){
    .widget,.app,.dots{animation:none; opacity:1;}
  }

  @media (max-height:640px){
    .widget .time{font-size:36px;}
    .app-grid{gap:18px 26px;}
  }
</style>
</head>

<script>
  // horloge + date en francais
  function tick(){
    const now = new Date();
    const time = now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    const date = now.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
    document.getElementById('time').textContent = time;
    document.getElementById('date').textContent = date;
  }
  tick();
  setInterval(tick, 1000 * 15);

  // logo : detourage du fond blanc en temps reel (video -> canvas)
  (function(){
    const v = document.getElementById('logoSrc');
    const canvas = document.getElementById('logoCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const W = canvas.width, H = canvas.height;
    let rafId = null;

    function drawFrame(){
      ctx.drawImage(v, 0, 0, W, H);
      const frame = ctx.getImageData(0, 0, W, H);
      const d = frame.data;
      for (let i = 0; i < d.length; i += 4){
        const lum = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
        const alpha = 255 - lum; // blanc -> transparent, noir -> opaque
        d[i] = 0; d[i+1] = 0; d[i+2] = 0; d[i+3] = alpha;
      }
      ctx.putImageData(frame, 0, 0);
    }

    function loop(){
      if (!v.paused && !v.ended){
        drawFrame();
        rafId = requestAnimationFrame(loop);
      } else if (v.ended){
        drawFrame();
      }
    }

    v.addEventListener('loadeddata', () => { v.play().catch(() => {}); });
    v.addEventListener('play', () => { rafId = requestAnimationFrame(loop); });
    v.addEventListener('ended', drawFrame);
  })();

  // etoiles decoratives
  const starsEl = document.getElementById('stars');
  const starCount = 40;
  let starsHtml = '';
  for (let i = 0; i < starCount; i++){
    const x = Math.random() * 100;
    const y = Math.random() * 60;
    const o = (Math.random() * 0.5 + 0.2).toFixed(2);
    starsHtml += `<span style="left:${x}%; top:${y}%; opacity:${o};"></span>`;
  }
  starsEl.innerHTML = starsHtml;
</script>
